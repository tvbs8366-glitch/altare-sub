    port: 28030
    uuid: 90a0f8d2-8ea8-49c2-8216-85e73c2712c1
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.microsoft.com
    reality-opts:
      public-key: 4MVjQGWzeL3-BjNXhrvfBE45lK3lM41CMkCUxFk1sFI
      short-id: d0ea752d
    client-fingerprint: chrome
  - name: Altare-WS
    type: vless
    server: tvbs747.eu.cc
    port: 443
    uuid: 90a0f8d2-8ea8-49c2-8216-85e73c2712c1
    network: ws
    tls: true
    udp: true
    servername: tvbs747.eu.cc
    ws-opts:
      path: /vless
    client-fingerprint: chrome
  - name: RAKsmart-HK
    type: vless
    server: 107.149.102.86
    port: 8443
    uuid: a72700be-ce1a-49c6-b40c-f78cb0901d2b
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.apple.com
    reality-opts:
      public-key: Nc9YqvQat0Pq8BeuQX3As__agheGqYe-AMt2a-TSXjY
      short-id: cc9b5626fb66488f
    client-fingerprint: chrome
rule-providers:
  adblock:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list"
    path: ./ruleset/adblock.yaml
    interval: 86400
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - Altare-SG
      - Altare-WS
      - RAKsmart-HK
      - DIRECT
rules:
  - RULE-SET,adblock,REJECT
  - MATCH,PROXY
